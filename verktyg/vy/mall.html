<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompositionsmatris</title>
<!-- Mall för "ig-composer vy". Verktyget ersätter DATA-platshållaren nedan
     med arbetsytans IG:ar, matrisen och varje IG:s komposition.json. -->
<style>
:root {
  --bg: #f7f6f4;
  --yta: #ffffff;
  --yta2: #f0eeeb;
  --text: #22201e;
  --svag: #6b6660;
  --kant: #dedad4;
  --fokus: #a33a6a;
  --byggblock: #2f6db5;
  --byggblock-bg: #e6eef8;
  --federation: #8a6a2f;
  --federation-bg: #f3ebdc;
  --tjanst: #a33a6a;
  --tjanst-bg: #f6e6ee;
  --konvention: #5f6670;
  --konvention-bg: #eceef1;
  --lokal: #2e7d4f;
  --kopierad: #2f6db5;
  --genererad: #7a4fb5;
  --ruleset: #5f6670;
  --refererad: #8a6a2f;
  --utelamnat: #b0413e;
  --shall: #22201e;
  --should: #6b6660;
  --skugga: 0 1px 2px rgb(0 0 0 / 6%), 0 2px 8px rgb(0 0 0 / 4%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171615;
    --yta: #201f1d;
    --yta2: #2a2826;
    --text: #ecebe8;
    --svag: #a39e97;
    --kant: #3a3734;
    --fokus: #e07aa8;
    --byggblock: #7fb0ec;
    --byggblock-bg: #1f2c3c;
    --federation: #d9b77a;
    --federation-bg: #352c1d;
    --tjanst: #e07aa8;
    --tjanst-bg: #3a2230;
    --konvention: #a9b0ba;
    --konvention-bg: #2b2e33;
    --lokal: #6cc38f;
    --kopierad: #7fb0ec;
    --genererad: #b597e6;
    --ruleset: #a9b0ba;
    --refererad: #d9b77a;
    --utelamnat: #e88480;
    --shall: #ecebe8;
    --should: #a39e97;
    --skugga: none;
  }
}
:root[data-theme="dark"] {
  --bg: #171615; --yta: #201f1d; --yta2: #2a2826; --text: #ecebe8; --svag: #a39e97; --kant: #3a3734;
  --fokus: #e07aa8; --byggblock: #7fb0ec; --byggblock-bg: #1f2c3c; --federation: #d9b77a; --federation-bg: #352c1d;
  --tjanst: #e07aa8; --tjanst-bg: #3a2230; --konvention: #a9b0ba; --konvention-bg: #2b2e33;
  --lokal: #6cc38f; --kopierad: #7fb0ec; --genererad: #b597e6; --ruleset: #a9b0ba; --refererad: #d9b77a;
  --utelamnat: #e88480; --shall: #ecebe8; --should: #a39e97; --skugga: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 0 0 4px; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--svag); margin: 22px 0 8px; font-weight: 600; }
p { margin: 0 0 8px; }
.svag { color: var(--svag); }
.liten { font-size: 0.85rem; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; }

header.topp { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.sok { position: relative; flex: 1 1 320px; max-width: 460px; }
.sok input {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--kant);
  background: var(--yta); color: var(--text); font: inherit;
}
.sok ul {
  position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
  list-style: none; background: var(--yta); border: 1px solid var(--kant); border-radius: 8px;
  box-shadow: var(--skugga); max-height: 360px; overflow: auto;
}
.sok li { padding: 7px 9px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.sok li[aria-selected="true"], .sok li:hover { background: var(--yta2); }
.sok li .svag { margin-left: auto; font-size: 0.8rem; white-space: nowrap; }

.kort { background: var(--yta); border: 1px solid var(--kant); border-radius: 12px; box-shadow: var(--skugga); }
.matrisram { overflow-x: auto; padding: 4px; }
table.matris { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 520px; }
table.matris th, table.matris td { border-radius: 10px; padding: 12px; vertical-align: top; text-align: left; }
table.matris thead th { background: var(--byggblock-bg); }
table.matris tbody th { background: var(--federation-bg); width: 22%; }
table.matris td { background: var(--yta2); min-width: 160px; }
table.matris .hörn { background: transparent; color: var(--svag); font-weight: 500; font-size: 0.8rem; vertical-align: bottom; }
.hörn .pil { display: block; }
.huvud { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.huvud strong { display: block; }
.huvud .mono { color: var(--svag); }
.kandidat {
  display: block; border: 1.5px dashed var(--kant); border-radius: 8px; padding: 8px 10px;
  color: var(--svag); font-size: 0.85rem;
}
.dimma td .chip:not(.träff), .dimma .huvud:not(.träff), .dimma .igchip:not(.träff) { opacity: 0.35; }
.huvud.träff strong { text-decoration: underline 2px var(--fokus); text-underline-offset: 3px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px;
  border: 1px solid transparent; background: var(--yta); cursor: pointer; margin: 2px 4px 2px 0;
  font-size: 0.9rem; line-height: 1.3; text-align: left;
}
.chip.tjanst { background: var(--tjanst); color: #fff; font-weight: 600; }
:root:not([data-theme="light"]) .chip.tjanst { color: #fff; }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fokus); }
.chip.träff { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fokus); }
.prick { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.r-byggblock { --rf: var(--byggblock); --rb: var(--byggblock-bg); }
.r-federation { --rf: var(--federation); --rb: var(--federation-bg); }
.r-tjanst { --rf: var(--tjanst); --rb: var(--tjanst-bg); }
.r-konvention { --rf: var(--konvention); --rb: var(--konvention-bg); }
.prick { background: var(--rf, var(--svag)); }
.igchip { background: var(--rb); color: var(--text); border-color: transparent; }

.alla { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 20px; padding: 14px 16px; }
.alla h3 { margin: 0 0 6px; }
.förklaring { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--svag); margin: 10px 2px 22px; }
.förklaring span { display: inline-flex; align-items: center; gap: 6px; }

.panel { padding: 20px; margin-top: 18px; }
.panelhuvud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.etiketter { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.etikett { font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; background: var(--yta2); color: var(--svag); }
.etikett.r { background: var(--rb); color: var(--rf); font-weight: 600; }
.flikar { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--kant); margin: 16px 0 4px; }
.flikar button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--svag);
  margin-bottom: -1px;
}
.flikar button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--fokus); font-weight: 600; }
.flikar .antal { font-size: 0.75rem; background: var(--yta2); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

.filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.filter input[type="search"], .filter select {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--kant); background: var(--yta); color: var(--text); font: inherit; font-size: 0.9rem;
}
.växel {
  border: 1px solid var(--kant); background: var(--yta); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 0.82rem;
  display: inline-flex; align-items: center; gap: 6px;
}
.växel[aria-pressed="false"] { opacity: 0.5; }

.tabellram { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.data th { text-align: left; font-weight: 600; color: var(--svag); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--kant); white-space: nowrap; }
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--kant); vertical-align: top; }
table.data tr.grupp td { background: var(--yta2); font-weight: 600; padding-top: 9px; }
.länk { background: none; border: 0; padding: 0; color: var(--fokus); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fokus) 40%, transparent); text-underline-offset: 2px; }

.läge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.läge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--lf); }
.l-lokal { --lf: var(--lokal); } .l-kopierad { --lf: var(--kopierad); } .l-genererad { --lf: var(--genererad); }
.l-ruleset, .l-alias { --lf: var(--ruleset); } .l-refererad { --lf: var(--refererad); } .l-utelämnat { --lf: var(--utelamnat); }
.kod { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; padding: 1px 6px; border-radius: 5px; background: var(--yta2); white-space: nowrap; }
.kod.SHALL { font-weight: 700; color: var(--shall); }
.kod.SHOULD, .kod.MAY { color: var(--should); }
.härkomst { font-size: 0.78rem; color: var(--svag); }

ul.träd { list-style: none; margin: 0; padding: 0; }
ul.träd li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.via { color: var(--svag); font-size: 0.82rem; }
.tom { color: var(--svag); padding: 16px 0; }
.kolumner { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 28px; }
.fot { margin-top: 28px; font-size: 0.8rem; color: var(--svag); }

/* Sekvensdiagram: en kolumn per scenarioaktör, en rad per steg. */
.sekvens { display: grid; gap: 0; font-size: 0.86rem; min-width: 640px; }
.sekvens > div { padding: 6px 8px; }
.sekvens .bana { text-align: center; border-radius: 8px; background: var(--rb, var(--yta2)); margin: 0 4px 6px; padding: 8px 6px; }
.sekvens .bana strong { display: block; font-size: 0.85rem; }
.sekvens .bana .liten { font-size: 0.72rem; color: var(--svag); display: block; }
.sekvens .steg { border-top: 1px solid var(--kant); }
.sekvens .steg .nr { font-family: ui-monospace, Menlo, monospace; color: var(--svag); margin-right: 6px; }
.sekvens .steg .op { display: block; font-size: 0.75rem; color: var(--svag); margin-top: 2px; }
.sekvens .liv { border-top: 1px solid var(--kant); position: relative; }
.sekvens .liv::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px dashed var(--kant); }
.sekvens .pil { position: relative; align-self: center; height: 22px; z-index: 1; pointer-events: none; }
.sekvens .pil .linje { position: absolute; top: 10px; height: 2px; background: var(--text); }
.sekvens .pil .linje::after { content: ""; position: absolute; top: -5px; border: 6px solid transparent; }
.sekvens .pil.höger .linje::after { right: -6px; border-left-color: var(--text); border-right-width: 0; }
.sekvens .pil.vänster .linje::after { left: -6px; border-right-color: var(--text); border-left-width: 0; }
.sekvens .pil .själv { position: absolute; top: 2px; left: calc(50% - 2px); width: 26px; height: 16px; border: 2px solid var(--text); border-left: 0; border-radius: 0 8px 8px 0; }
.sekvens .pil.saknas .linje { background: var(--utelamnat); }
.sekvens .pil.saknas.höger .linje::after { border-left-color: var(--utelamnat); }
.sekvens .pil.saknas.vänster .linje::after { border-right-color: var(--utelamnat); }
.sekvens .invävd, .sekvens .rubrikrad.invävd { background: color-mix(in srgb, var(--federation-bg) 70%, transparent); }
.sekvens .rubrikrad { border-top: 1px solid var(--kant); font-size: 0.8rem; color: var(--federation); font-weight: 600; padding: 6px 8px; }
.sekvens .rubrikrad.alt { color: var(--svag); font-weight: 500; font-style: italic; background: none; }
.ok { color: var(--lokal); } .nej { color: var(--utelamnat); font-weight: 700; }
.sekvensram { overflow-x: auto; margin: 8px 0 4px; }
@media (max-width: 560px) {
  main { padding-top: 16px; }
  .panel { padding: 14px; }
  table.matris tbody th { width: auto; }
}
</style>
</head>
<body>
<main>
  <header class="topp">
    <div>
      <h1>Kompositionsmatris</h1>
      <p class="svag liten" id="undertitel"></p>
    </div>
    <div class="sok" role="search">
      <input id="sok" type="search" placeholder="Sök artefakt, aktör eller paket …" autocomplete="off"
             aria-label="Sök artefakt, aktör eller paket" aria-controls="sokresultat" aria-expanded="false">
      <ul id="sokresultat" role="listbox" hidden></ul>
    </div>
  </header>

  <section class="kort matrisram" aria-label="Matris federation × domän">
    <table class="matris" id="matris"></table>
  </section>
  <div class="förklaring" id="förklaring"></div>

  <section class="kort alla" id="alla" aria-label="IG:ar i arbetsytan"></section>

  <section class="kort panel" id="panel" aria-live="polite"></section>

  <p class="fot" id="fot"></p>
</main>

<script>
const DATA = /*__DATA__*/null;

// ------------------------------------------------------------------ hjälp
const el = (tag, attrs = {}, ...barn) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const b of barn.flat()) if (b !== null && b !== undefined && b !== false) e.append(b.nodeType ? b : String(b));
  return e;
};
const ROLL = { byggblock: 'Byggblock', federation: 'Federation', tjanst: 'Tjänst', konvention: 'Konvention' };
const LÄGE = {
  lokal: 'lokal', kopierad: 'kopierad', genererad: 'genererad', ruleset: 'RuleSet', alias: 'alias',
  refererad: 'refererad', utelämnat: 'utelämnat',
};
const igs = new Map((DATA?.igs || []).map((i) => [i.id, i]));
const M = DATA?.manifest || {};
const ig = (id) => igs.get(id) || { id, titel: id };
const kort = (id) => (ig(id).titel || id).replace(/^(Byggblock|Federation): /, '').split(' – ')[0];
const rollKlass = (id) => `r-${ig(id).roll || 'okänd'}`;
const prick = (id) => el('span', { class: `prick ${rollKlass(id)}`, 'aria-hidden': 'true' });

// Var finns ett paket med, och via vad? (paket-id → [{ig, inkludering, via}])
const användsI = new Map();
for (const [igId, m] of Object.entries(M)) {
  for (const p of m.paket) {
    if (!användsI.has(p.id)) användsI.set(p.id, []);
    användsI.get(p.id).push({ ig: igId, inkludering: p.inkludering, via: p.via });
  }
}

// Artefaktindex: samma artefakt (hemvist + namn) i alla IG:ar där den finns.
const artefakter = new Map();
for (const [igId, m] of Object.entries(M)) {
  const rader = [
    ...m.artefakter,
    ...(m.refererat || []).map((a) => ({ ...a, lage: 'refererad' })),
    ...(m.utelamnat || []).map((a) => ({ ...a, lage: 'utelämnat' })),
  ];
  for (const a of rader) {
    if (a.lage === 'alias') continue;
    const nyckel = `${a.paket}|${a.namn}`;
    if (!artefakter.has(nyckel)) artefakter.set(nyckel, { nyckel, namn: a.namn, titel: a.titel, typ: a.typ, paket: a.paket, kopieradFran: a.kopieradFran, finns: [] });
    artefakter.get(nyckel).finns.push({ ig: igId, lage: a.lage, via: a.via || [], injiceradBas: a.injiceradBas, skal: a.skal });
  }
}
// En artefakt ligger lokalt i sin hemvist även om hemvisten inte har ett eget manifest.
for (const a of artefakter.values()) {
  if (!a.finns.some((f) => f.ig === a.paket) && igs.has(a.paket) && !M[a.paket]) a.finns.unshift({ ig: a.paket, lage: 'lokal', via: [] });
}
const aktorPaket = new Map();
for (const a of artefakter.values()) if (a.typ === 'ActorDefinition') aktorPaket.set(a.namn, a.paket);

// ------------------------------------------------------------------ tillstånd
const state = { vy: null, id: null, flik: null, aktor: null, filter: {} };
function läsHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  state.vy = q.get('vy'); state.id = q.get('id'); state.flik = q.get('flik'); state.aktor = q.get('aktor');
}
function skrivHash() {
  const q = new URLSearchParams();
  for (const k of ['vy', 'id', 'flik', 'aktor']) if (state[k]) q.set(k, state[k]);
  history.replaceState(null, '', q.toString() ? `#${q}` : location.pathname);
}
function välj(vy, id, extra = {}) {
  Object.assign(state, { vy, id, flik: null, aktor: null, filter: {} }, extra);
  skrivHash();
  rita();
  document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Vilka IG:ar ska markeras i matrisen för aktuellt val?
function markerade() {
  if (!state.id) return null;
  if (state.vy === 'tjanst') return new Set([state.id]);
  if (state.vy === 'paket') return new Set([state.id, ...(användsI.get(state.id) || []).map((u) => u.ig)]);
  if (state.vy === 'artefakt') return new Set((artefakter.get(state.id)?.finns || []).filter((f) => f.lage !== 'utelämnat').map((f) => f.ig));
  return null;
}

// ------------------------------------------------------------------ matris
function ritaMatris() {
  const träff = markerade();
  const t = document.getElementById('matris');
  t.replaceChildren();
  t.classList.toggle('dimma', !!träff);
  const { domaner = [], rader = [] } = DATA.matris || {};
  const huvudknapp = (id) => el('button', {
    class: `huvud${träff?.has(id) ? ' träff' : ''}`, onclick: () => välj('paket', id),
    title: `Visa ${ig(id).titel}`,
  }, el('strong', {}, kort(id)), el('span', { class: 'mono' }, id));
  t.append(el('thead', {}, el('tr', {},
    el('th', { class: 'hörn', scope: 'col' }, el('span', { class: 'pil' }, 'Domän →'), 'Federation ↓'),
    domaner.map((d) => el('th', { scope: 'col' }, huvudknapp(d))),
  )));
  t.append(el('tbody', {}, rader.map((r) => el('tr', {},
    el('th', { scope: 'row' }, huvudknapp(r.federation)),
    r.celler.map((c) => el('td', {}, c.tjanster.length
      ? c.tjanster.map((tj) => el('button', {
        class: `chip tjanst${träff?.has(tj) ? ' träff' : ''}`,
        'aria-pressed': state.vy === 'tjanst' && state.id === tj ? 'true' : 'false',
        onclick: () => välj('tjanst', tj),
      }, kort(tj)))
      : el('span', { class: 'kandidat' }, 'kandidat'))),
  ))));
}

function ritaAlla() {
  const träff = markerade();
  const s = document.getElementById('alla');
  s.replaceChildren();
  s.classList.toggle('dimma', !!träff);
  for (const roll of ['tjanst', 'byggblock', 'federation', 'konvention']) {
    const lista = [...igs.values()].filter((i) => i.roll === roll);
    if (!lista.length) continue;
    s.append(el('div', {},
      el('h3', {}, { tjanst: 'Tjänster', byggblock: 'Byggblock', federation: 'Federationer', konvention: 'Konventioner' }[roll]),
      lista.map((i) => el('button', {
        class: `chip igchip ${rollKlass(i.id)}${träff?.has(i.id) ? ' träff' : ''}`,
        'aria-pressed': state.id === i.id ? 'true' : 'false',
        onclick: () => välj(roll === 'tjanst' ? 'tjanst' : 'paket', i.id),
        title: i.id,
      }, prick(i.id), kort(i.id), i.publicering === 'intern' ? el('span', { class: 'svag liten' }, 'intern') : null)),
    ));
  }
}

function ritaFörklaring() {
  const f = document.getElementById('förklaring');
  f.replaceChildren(
    ...['byggblock', 'federation', 'tjanst', 'konvention'].map((r) => el('span', {}, el('span', { class: `prick r-${r}` }), ROLL[r])),
    el('span', {}, '·'),

function ritaIg(p, id) {

    m.kravprofiler.length && { id: 'krav', titel: 'Kravprofiler', antal: m.kravprofiler.length, rita: (c) => ritaKrav(c, m) },

    { id: 'paket', titel: 'Komponerade paket', antal: m.paket.length, rita: (c) => ritaKomponerade(c, m) },
    { id: 'diag', titel: 'Diagnostik', antal: diag, rita: (c) => ritaDiagnostik(c, m) },

    el('div', {},
      el('h3', {}, 'Härleds från'),
      el('ul', { class: 'träd' },
        el('li', {}, prick(m.ig.id), el('strong', {}, k.aktorTitel || k.aktor), el('span', { class: 'mono svag' }, k.aktor)),
        k.forfader.map((f) => el('li', { style: `padding-left:${f.djup * 20}px` },

  // Elementkrav, grupperade per profil, filtrerbara per aktör.
  const aktörer = [...new Set(k.element.map((o) => o.aktor))];

// ------------------------------------------------------------------ användningsfall
function ritaAnvandningsfall(c, m) {
  const ucs = m.anvandningsfall;
  const u = ucs.find((x) => x.namn === state.aktor) || ucs[0];
  c.append(el('div', { class: 'filter', role: 'group', 'aria-label': 'Användningsfall eller delflöde' },
    ucs.map((x) => el('button', {
      class: `chip igchip ${x.typ === 'delflode' ? rollKlass(x.paket) : 'r-tjanst'}`, 'aria-pressed': x === u ? 'true' : 'false',
      onclick: () => { state.aktor = x.namn; skrivHash(); ritaPanel(); },
    }, x.typ === 'delflode' ? `Delflöde: ${x.titel}` : x.titel))));
  c.append(
    el('p', {}, u.syfte || ''),
    el('p', { class: 'svag liten' }, `${u.typ === 'delflode' ? 'Delflöde' : 'Användningsfall'} `, artLänk(m.ig.id, u.namn), ` · skiss: `, el('code', {}, `${u.fil}`), ` i `, kort(u.paket)),
  );

  // Sekvensdiagram
  const banor = u.aktorer;
  const kol = new Map(banor.map((b, i) => [b.nyckel, i]));
  const grid = el('div', { class: 'sekvens', style: `grid-template-columns: minmax(190px, 1.6fr) repeat(${banor.length}, minmax(96px, 1fr))` });
  grid.append(el('div', {}), ...banor.map((b) => el('div', { class: `bana ${b.paket ? rollKlass(b.paket) : ''}` },
    el('strong', {}, b.titel),
    el('span', { class: 'liten' }, b.roller.join(' + ')),
    el('span', { class: 'liten' }, b.typ === 'person' ? 'person' : b.stodtjanst ? 'stödtjänst' : b.spelasAv.length ? `spelas av ${b.spelasAv.join(', ')}` : ''),
  )));
  let radNr = 1; // rad 1 är aktörerna
  const fullbredd = (cls, ...barn) => el('div', { class: cls, style: `grid-column: 1 / ${banor.length + 2}; grid-row: ${++radNr}` }, ...barn);
  const rad = (st, extra = '') => {
    const invävd = st.invavd ? ' invävd' : '';
    if (st.typ === 'delflode') {
      grid.append(fullbredd(`rubrikrad invävd`, `${st.nr} ↳ invävt från ${kort(st.invavd)}: `, el('button', { class: 'länk', onclick: () => { state.aktor = st.delflode; skrivHash(); ritaPanel(); } }, st.titel)));
      return;
    }
    const tack = st.tackning || {};
    const märke = (v) => (v === true ? el('span', { class: 'ok', title: 'förmågan finns' }, '✓') : v === false ? el('span', { class: 'nej', title: 'förmågan saknas' }, '✕') : null);
    const r = ++radNr;
    grid.append(el('div', { class: `steg${invävd}${extra}`, style: `grid-row: ${r}; grid-column: 1` },
      el('span', { class: 'nr' }, st.nr), st.titel,
      st.operation || st.profil || st.resurstyp ? el('span', { class: 'op' },
        [st.operation, st.profil || st.resurstyp].filter(Boolean).join(' · '),
        tack.fran !== undefined || tack.till !== undefined ? el('span', {}, '  förmåga ', märke(tack.fran), märke(tack.till)) : null) : null,
      st.krav ? el('span', { class: 'op' }, `krav: ${st.krav}`) : null,
    ));
    banor.forEach((_, i) => grid.append(el('div', { class: `liv${invävd}`, style: `grid-row: ${r}; grid-column: ${i + 2}` })));
    const a = kol.get(st.fran);
    const b = kol.get(st.till);
    if (a === undefined || b === undefined) return;
    const saknas = tack.fran === false || tack.till === false ? ' saknas' : '';
    const pil = el('div', { class: `pil ${b >= a ? 'höger' : 'vänster'}${saknas}` });
    const [min, max] = [Math.min(a, b), Math.max(a, b)];
    const spann = max - min + 1;
    pil.style.gridColumn = `${min + 2} / ${max + 3}`;
    pil.style.gridRow = String(r);
    if (a === b) pil.append(el('span', { class: 'själv' }));
    else pil.append(el('span', { class: 'linje', style: `left:${50 / spann}%;right:${50 / spann}%` }));
    grid.append(pil);
  };
  for (const st of u.steg) {
    rad(st);
    for (const alt of st.alternativ || []) {
      grid.append(fullbredd('rubrikrad alt', `Alternativ till ${st.nr}: ${alt.titel}`));
      for (const as of alt.steg) rad(as, ' alt');
    }
  }
  c.append(el('h3', {}, 'Scenario'), el('div', { class: 'sekvensram' }, grid));

  // Spårbarhet: krav per aktör → steg → informationsbehov → uppfylls av
  const perId = new Map(m.artefakter.map((a) => [a.id, a]));
  const uppfylls = (u2) => {
    const id = u2.split('/').pop();
    const a = perId.get(id);
    return a ? el('div', {}, el('button', { class: 'länk', onclick: () => välj('artefakt', `${a.paket}|${a.namn}`) }, a.titel || a.namn)) : el('div', { class: 'mono' }, id);
  };
  const bana = (k) => banor.find((b) => b.nyckel === k);
  const rader = u.krav.flatMap((k) => k.satser.map((sats) => ({ k, sats })));
  c.append(
    el('h3', {}, `Spårbarhet (${rader.length} kravsatser)`),
    rader.length ? el('div', { class: 'tabellram' }, el('table', { class: 'data' },
      el('thead', {}, el('tr', {}, ['Nyckel', 'Krav', 'Aktör', 'Uppfylls av', 'Källa'].map((h) => el('th', {}, h)))),
      el('tbody', {}, rader.map(({ k, sats }) => el('tr', {},
        el('td', { class: 'mono', style: 'white-space:nowrap' }, sats.nyckel),
        el('td', {}, el('span', { class: `kod ${sats.styrka}` }, sats.styrka), ' ', sats.krav),
        el('td', {}, bana(k.bana)?.titel || k.bana, bana(k.bana)?.spelasAv.length ? el('div', { class: 'via' }, bana(k.bana).roller.join(' + ')) : null),
        el('td', {}, sats.satisfiedBy.length ? sats.satisfiedBy.map(uppfylls) : el('span', { class: 'nej' }, 'saknas')),
        el('td', {}, artLänk(m.ig.id, k.namn)),
      ))),
    )) : el('p', { class: 'tom' }, u.typ === 'delflode' && ig(m.ig.id).roll === 'tjanst'
      ? 'Delflödets krav ingår i de användningsfall det vävs in i.' : 'Inga krav genererade.'),
  );

  // Täckning
  const ops = [];
  const samla = (lista) => { for (const st of lista) { if (st.tackning) ops.push(st); samla((st.alternativ || []).flatMap((a) => a.steg)); } };
  samla(u.steg);
  const brister = ops.filter((st) => st.tackning.fran === false || st.tackning.till === false);
  const ospelade = banor.filter((b) => ig(m.ig.id).roll === 'tjanst' && b.typ === 'system' && !b.stodtjanst && !b.spelasAv.length);
  const info = (m.anvandningsfall.find((x) => x.namn === u.namn)?.informationsbehov) || [];
  c.append(el('h3', {}, 'Täckning'), el('ul', {},
    el('li', {}, info.every((i) => i.profil) ? el('span', { class: 'ok' }, '✓ ') : el('span', { class: 'nej' }, '✕ '),
      `Informationsbehov: ${info.map((i) => `${i.titel} → ${i.profil || 'ingen profil'}`).join(', ') || 'inga'}`),
    el('li', {}, brister.length ? el('span', { class: 'nej' }, '✕ ') : el('span', { class: 'ok' }, '✓ '),
      brister.length ? `Förmåga saknas i steg ${brister.map((b) => b.nr).join(', ')}` : `${ops.length} operationer: avsändare och mottagare har förmågan`),
    ig(m.ig.id).roll === 'tjanst' ? el('li', {}, ospelade.length ? el('span', { class: 'nej' }, '✕ ') : el('span', { class: 'ok' }, '✓ '),
      ospelade.length ? `Ingen tjänsteaktör spelar ${ospelade.map((b) => b.titel).join(', ')}` : 'Alla systemaktörer spelas av en tjänsteaktör eller är stödtjänster') : null,
  ));
}

  p.append(igHuvud(id));
  const i = ig(id);
  const användning = användsI.get(id) || [];
  const härifrån = [...artefakter.values()].filter((a) => a.paket === id);
  c2(p,
    el('div', {},
      el('h3', {}, 'Komponerar'),
      i.komponerar?.length ? el('ul', { class: 'träd' }, i.komponerar.map((k) => el('li', {}, prick(k.paket),
        el('button', { class: 'länk', onclick: () => välj('paket', k.paket) }, ig(k.paket).titel || k.paket),
        el('span', { class: 'via' }, k.inkludering ? `${k.version}, ${k.inkludering}` : k.version)))) : el('p', { class: 'svag' }, 'Inget.'),
    ),
    el('div', {},
      el('h3', {}, `Används i (${användning.length})`),
      användning.length ? el('ul', { class: 'träd' }, användning.map((u) => el('li', {}, prick(u.ig),
        el('button', { class: 'länk', onclick: () => välj(ig(u.ig).roll === 'tjanst' ? 'tjanst' : 'paket', u.ig) }, kort(u.ig)),
        el('span', { class: 'via' }, `${u.inkludering}${u.via.length ? ` via ${u.via.map(kort).join(' → ')}` : ', direkt'}`)))) : el('p', { class: 'svag' }, 'Ingen IG komponerar detta paket.'),
    ),
  );
  if (M[id]?.anvandningsfall?.length) {
    const c = el('div');
    p.append(el('h3', {}, 'Användningsfall och delflöden'), c);
    ritaAnvandningsfall(c, M[id]);
  }
  p.append(
    el('h3', {}, `Artefakter härifrån (${härifrån.length})`),
    härifrån.length ? el('div', { class: 'tabellram' }, el('table', { class: 'data' },
      el('thead', {}, el('tr', {}, ['Artefakt', 'Typ', 'Finns i'].map((h) => el('th', {}, h)))),
      el('tbody', {}, härifrån.map((a) => el('tr', {},
        el('td', {}, el('button', { class: 'länk', onclick: () => välj('artefakt', a.nyckel) }, a.titel || a.namn)),
        el('td', { class: 'liten' }, a.typ),
        el('td', {}, a.finns.map((f) => el('span', { style: 'display:inline-flex;gap:4px;margin-right:12px', class: `läge l-${f.lage}` }, kort(f.ig)))),
      ))),
    )) : el('p', { class: 'tom' }, 'Inga artefakter från detta paket finns i någon komposition.json.'),
  );
}

function ritaArtefakt(p, nyckel) {
  const a = artefakter.get(nyckel);
  if (!a) return p.append(el('p', { class: 'tom' }, `Hittar inte ${nyckel}.`));
  p.append(
    el('div', { class: 'panelhuvud' }, el('h2', {}, a.titel || a.namn), el('span', { class: 'mono svag' }, a.namn)),
    el('div', { class: 'etiketter' },
      el('span', { class: 'etikett' }, a.typ),
      el('span', { class: `etikett r ${rollKlass(a.paket)}` }, 'hemvist: ', kort(a.paket)),
      a.kopieradFran ? el('span', { class: 'etikett mono' }, a.kopieradFran) : null),
    el('h3', {}, `Finns i (${a.finns.length})`),
    el('div', { class: 'tabellram' }, el('table', { class: 'data' },
      el('thead', {}, el('tr', {}, ['IG', 'Läge', 'Via'].map((h) => el('th', {}, h)))),
      el('tbody', {}, a.finns.map((f) => el('tr', {},
        el('td', {}, prick(f.ig), ' ', el('button', { class: 'länk', onclick: () => välj(ig(f.ig).roll === 'tjanst' ? 'tjanst' : 'paket', f.ig) }, ig(f.ig).titel || f.ig)),
        el('td', {}, el('span', { class: `läge l-${f.lage}` }, LÄGE[f.lage] || f.lage),
          f.injiceradBas ? el('div', { class: 'härkomst' }, `+ Bas(${f.injiceradBas})`) : null,
          f.skal ? el('div', { class: 'härkomst' }, f.skal) : null),
        el('td', { class: 'via' }, f.via.length ? f.via.map(kort).join(' → ') : '–'),
      ))),
    )),
  );
}

function c2(p, ...delar) { p.append(el('div', { class: 'kolumner' }, delar)); }
function artLänk(igId, namn) {
  const a = (M[igId]?.artefakter || []).find((x) => x.namn === namn);
  if (!a) return el('span', { class: 'mono' }, namn);
  return el('button', { class: 'länk', onclick: () => välj('artefakt', `${a.paket}|${a.namn}`) }, a.titel || a.namn);
}
function aktörLänk(namn, titel) {
  const paket = aktorPaket.get(namn);
  if (!paket) return el('span', { class: 'mono' }, titel || namn);
  return el('button', { class: 'länk', onclick: () => välj('artefakt', `${paket}|${namn}`), title: namn }, titel || namn);
}

// ------------------------------------------------------------------ sök
const sökfält = document.getElementById('sok');
const sökLista = document.getElementById('sokresultat');
let träffar = [];
let markör = -1;
function sök(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const ut = [];
  for (const i of igs.values()) {
    if (`${i.id} ${i.titel}`.toLowerCase().includes(q)) ut.push({ etikett: i.titel, typ: 'IG', info: ROLL[i.roll] || 'IG', roll: i.id, gå: () => välj(i.roll === 'tjanst' ? 'tjanst' : 'paket', i.id) });
  }
  for (const a of artefakter.values()) {
    if (`${a.namn} ${a.titel || ''}`.toLowerCase().includes(q)) {
      ut.push({ etikett: a.titel || a.namn, typ: a.typ, info: `${a.typ} · ${a.finns.length} IG`, roll: a.paket, gå: () => välj('artefakt', a.nyckel) });
    }
  }
  // Exakt träff före början-träff före övriga; därefter IG:ar, profiler och aktörer före annat.
  const TYP = { IG: 0, Profile: 1, ActorDefinition: 2, Extension: 3, Requirements: 4, CapabilityStatement: 5 };
  const rang = (t) => {
    const e = t.etikett.toLowerCase();
    return [e === q ? 0 : e.startsWith(q) ? 1 : 2, TYP[t.typ] ?? 9, e];
  };
  return ut
    .sort((a, b) => { const [x, y] = [rang(a), rang(b)]; return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2], 'sv'); })
    .slice(0, 14);
}
function visaTräffar() {
  sökLista.replaceChildren(...träffar.map((t, n) => el('li', {
    role: 'option', id: `tr${n}`, 'aria-selected': n === markör ? 'true' : 'false',
    onmousedown: (e) => { e.preventDefault(); t.gå(); stängSök(); },
  }, prick(t.roll), t.etikett, el('span', { class: 'svag' }, t.info))));
  sökLista.hidden = !träffar.length;
  sökfält.setAttribute('aria-expanded', String(!!träffar.length));
  sökfält.setAttribute('aria-activedescendant', markör >= 0 ? `tr${markör}` : '');
}
function stängSök() { träffar = []; markör = -1; visaTräffar(); }
sökfält.addEventListener('input', () => { träffar = sök(sökfält.value); markör = träffar.length ? 0 : -1; visaTräffar(); });
sökfält.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && träffar.length) { markör = (markör + 1) % träffar.length; visaTräffar(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && träffar.length) { markör = (markör - 1 + träffar.length) % träffar.length; visaTräffar(); e.preventDefault(); }
  else if (e.key === 'Enter' && markör >= 0) { träffar[markör].gå(); stängSök(); }
  else if (e.key === 'Escape') { stängSök(); }
});
sökfält.addEventListener('blur', () => setTimeout(stängSök, 100));

// ------------------------------------------------------------------ start
function rita() { ritaMatris(); ritaAlla(); ritaPanel(); }
function start() {
  if (!DATA) {
    document.getElementById('panel').append(el('p', {}, 'Ingen data. Sidan genereras med ', el('code', {}, 'ig-composer vy'), '.'));
    return;
  }
  const antal = Object.keys(M).length;
  document.getElementById('undertitel').textContent =
    `Federation × domän · ${igs.size} IG:ar, ${antal} med komposition.json · genererad ${new Date(DATA.genererad).toLocaleString('sv-SE')}`;
  const saknas = [...igs.values()].filter((i) => i.komponerar?.length && !M[i.id]).map((i) => i.id);
  document.getElementById('fot').textContent = saknas.length
    ? `Saknar komposition.json: ${saknas.join(', ')}. Kör ig-composer bygg före ig-composer vy.`
    : 'Data från varje IG:s komposition.json, framtagen av ig-composer.';
  ritaFörklaring();
  läsHash();
  rita();
}
window.addEventListener('hashchange', () => { läsHash(); rita(); });
start();
