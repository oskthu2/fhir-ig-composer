<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompositionsmatris</title>
<link rel="icon" href="data:,">
<!-- Mall för "ig-composer vy". Verktyget ersätter DATA-platshållaren nedan
     med arbetsytans IG:ar, matrisen och varje IG:s komposition.json. -->
<style>
:root {
  --bg: #f7f6f4;
  --yta: #ffffff;
  --yta2: #f0eeeb;
  --text: #22201e;
  --svag: #6b6660;
  --kant: #dedad4;
  --fokus: #a33a6a;
  --byggblock: #2f6db5;
  --byggblock-bg: #e6eef8;
  --federation: #8a6a2f;
  --federation-bg: #f3ebdc;
  --tjanst: #a33a6a;
  --tjanst-bg: #f6e6ee;
  --konvention: #5f6670;
  --konvention-bg: #eceef1;
  --stodtjanst: #2b7a78;
  --stodtjanst-bg: #e2f1f0;
  --lokal: #2e7d4f;
  --kopierad: #2f6db5;
  --genererad: #7a4fb5;
  --ruleset: #5f6670;
  --refererad: #8a6a2f;
  --utelamnat: #b0413e;
  --shall: #22201e;
  --should: #6b6660;
  --test: #a8570c;
  --test-bg: #fbeedd;
  --skugga: 0 1px 2px rgb(0 0 0 / 6%), 0 2px 8px rgb(0 0 0 / 4%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171615;
    --yta: #201f1d;
    --yta2: #2a2826;
    --text: #ecebe8;
    --svag: #a39e97;
    --kant: #3a3734;
    --fokus: #e07aa8;
    --byggblock: #7fb0ec;
    --byggblock-bg: #1f2c3c;
    --federation: #d9b77a;
    --federation-bg: #352c1d;
    --tjanst: #e07aa8;
    --tjanst-bg: #3a2230;
    --konvention: #a9b0ba;
    --konvention-bg: #2b2e33;
    --stodtjanst: #6cc7c3;
    --stodtjanst-bg: #1c3332;
    --lokal: #6cc38f;
    --kopierad: #7fb0ec;
    --genererad: #b597e6;
    --ruleset: #a9b0ba;
    --refererad: #d9b77a;
    --utelamnat: #e88480;
    --shall: #ecebe8;
    --should: #a39e97;
    --test: #f0a35e;
    --test-bg: #3a2a1a;
    --skugga: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171615; --yta: #201f1d; --yta2: #2a2826; --text: #ecebe8; --svag: #a39e97; --kant: #3a3734;
  --fokus: #e07aa8; --byggblock: #7fb0ec; --byggblock-bg: #1f2c3c; --federation: #d9b77a; --federation-bg: #352c1d;
  --tjanst: #e07aa8; --tjanst-bg: #3a2230; --konvention: #a9b0ba; --konvention-bg: #2b2e33;
  --stodtjanst: #6cc7c3; --stodtjanst-bg: #1c3332;
  --lokal: #6cc38f; --kopierad: #7fb0ec; --genererad: #b597e6; --ruleset: #a9b0ba; --refererad: #d9b77a;
  --utelamnat: #e88480; --shall: #ecebe8; --should: #a39e97; --skugga: none;
  --test: #f0a35e; --test-bg: #3a2a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
  max-width: 1180px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 0 0 4px; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--svag); margin: 22px 0 8px; font-weight: 600; }
p { margin: 0 0 8px; }
.svag { color: var(--svag); }
.liten { font-size: 0.85rem; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; }

header.topp { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.sok { position: relative; flex: 1 1 320px; max-width: 460px; }
.sok input {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--kant);
  background: var(--yta); color: var(--text); font: inherit;
}
.sok ul {
  position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
  list-style: none; background: var(--yta); border: 1px solid var(--kant); border-radius: 8px;
  box-shadow: var(--skugga); max-height: 360px; overflow: auto;
}
.sok li { padding: 7px 9px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.sok li[aria-selected="true"], .sok li:hover { background: var(--yta2); }
.sok li .svag { margin-left: auto; font-size: 0.8rem; white-space: nowrap; }

.kort { background: var(--yta); border: 1px solid var(--kant); border-radius: 12px; box-shadow: var(--skugga); }
.matrisram { overflow-x: auto; padding: 4px; }
table.matris { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 520px; }
table.matris th, table.matris td { border-radius: 10px; padding: 12px; vertical-align: top; text-align: left; }
table.matris thead th { background: var(--federation-bg); }
table.matris tbody th { background: var(--byggblock-bg); width: 22%; }
table.matris td { background: var(--yta2); min-width: 160px; }
table.matris .hörn { background: transparent; color: var(--svag); font-weight: 500; font-size: 0.8rem; vertical-align: bottom; }
.hörn .pil { display: block; }
.huvud { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.huvud strong { display: block; }
.huvud .mono { color: var(--svag); }
.kandidat {
  display: block; border: 1.5px dashed var(--kant); border-radius: 8px; padding: 8px 10px;
  color: var(--svag); font-size: 0.85rem;
}
.dimma td .chip:not(.träff), .dimma .huvud:not(.träff), .dimma .igchip:not(.träff) { opacity: 0.35; }
.huvud.träff strong { text-decoration: underline 2px var(--fokus); text-underline-offset: 3px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px;
  border: 1px solid transparent; background: var(--yta); cursor: pointer; margin: 2px 4px 2px 0;
  font-size: 0.9rem; line-height: 1.3; text-align: left;
}
.chip.tjanst { background: var(--tjanst); color: #fff; font-weight: 600; }
:root:not([data-theme="light"]) .chip.tjanst { color: #fff; }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fokus); }
.chip.träff { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fokus); }
.prick { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.r-byggblock { --rf: var(--byggblock); --rb: var(--byggblock-bg); }
.r-federation { --rf: var(--federation); --rb: var(--federation-bg); }
.r-tjanst { --rf: var(--tjanst); --rb: var(--tjanst-bg); }
.r-konvention { --rf: var(--konvention); --rb: var(--konvention-bg); }
.r-stodtjanst { --rf: var(--stodtjanst); --rb: var(--stodtjanst-bg); }

/* Systemperspektiv */
.status { font-size: 0.75rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--yta2); color: var(--svag); }
.status.ok, .status.registrerad { background: color-mix(in srgb, var(--lokal) 18%, transparent); color: var(--lokal); }
.status.delvis, .status.annan-version { background: color-mix(in srgb, var(--federation) 22%, transparent); color: var(--federation); }
.status.fel { background: color-mix(in srgb, var(--utelamnat) 18%, transparent); color: var(--utelamnat); }
.status.saknas { background: color-mix(in srgb, var(--utelamnat) 18%, transparent); color: var(--utelamnat); }
.del { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; padding: 0 6px; border-radius: 5px; margin: 1px 4px 1px 0; background: var(--yta2); }
.del.ja { color: var(--lokal); } .del.nej { color: var(--utelamnat); text-decoration: line-through; text-decoration-thickness: 1.5px; } .del.okänt { color: var(--svag); }
.siffror { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
.siffra { background: var(--yta2); border-radius: 10px; padding: 8px 14px; min-width: 120px; }
.siffra b { display: block; font-size: 1.35rem; line-height: 1.2; }
.siffra span { font-size: 0.78rem; color: var(--svag); }
.systemlista { padding: 14px 16px; margin-bottom: 18px; }
.systemlista h3 { margin: 0 0 8px; }
.inkl { background: color-mix(in srgb, var(--stodtjanst-bg) 70%, transparent); }
.sekvens .rubrikrad.inkl { color: var(--stodtjanst); }
.prick { background: var(--rf, var(--svag)); }
.igchip { background: var(--rb); color: var(--text); border-color: transparent; }

.alla { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 20px; padding: 14px 16px; }
.alla h3 { margin: 0 0 6px; }
.förklaring { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--svag); margin: 10px 2px 22px; }
.förklaring span { display: inline-flex; align-items: center; gap: 6px; }

.panel { padding: 20px; margin-top: 18px; }
.panelhuvud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.etiketter { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.etikett { font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; background: var(--yta2); color: var(--svag); }
.etikett.r { background: var(--rb); color: var(--rf); font-weight: 600; }
.flikar { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--kant); margin: 16px 0 4px; }
.flikar button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--svag);
  margin-bottom: -1px;
}
.flikar button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--fokus); font-weight: 600; }
.flikar .antal { font-size: 0.75rem; background: var(--yta2); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

.filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.filter input[type="search"], .filter select {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--kant); background: var(--yta); color: var(--text); font: inherit; font-size: 0.9rem;
}
.växel {
  border: 1px solid var(--kant); background: var(--yta); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 0.82rem;
  display: inline-flex; align-items: center; gap: 6px;
}
.växel[aria-pressed="false"] { opacity: 0.5; }

.tabellram { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.data th { text-align: left; font-weight: 600; color: var(--svag); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--kant); white-space: nowrap; }
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--kant); vertical-align: top; }
table.data tr.grupp td { background: var(--yta2); font-weight: 600; padding-top: 9px; }
.länk { background: none; border: 0; padding: 0; color: var(--fokus); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fokus) 40%, transparent); text-underline-offset: 2px; }

.läge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.läge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--lf); }
.l-lokal { --lf: var(--lokal); } .l-kopierad { --lf: var(--kopierad); } .l-genererad { --lf: var(--genererad); }
.l-ruleset, .l-alias { --lf: var(--ruleset); } .l-refererad { --lf: var(--refererad); } .l-utelämnat { --lf: var(--utelamnat); }
.kod { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; padding: 1px 6px; border-radius: 5px; background: var(--yta2); white-space: nowrap; }
.kod.SHALL { font-weight: 700; color: var(--shall); }
.kod.SHOULD, .kod.MAY { color: var(--should); }
.härkomst { font-size: 0.78rem; color: var(--svag); }

ul.träd { list-style: none; margin: 0; padding: 0; }
ul.träd li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.via { color: var(--svag); font-size: 0.82rem; }
.tom { color: var(--svag); padding: 16px 0; }
.kolumner { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 28px; }
.fot { margin-top: 28px; font-size: 0.8rem; color: var(--svag); }

/* Sekvensdiagram: en kolumn per scenarioaktör, en rad per steg. */
.sekvens { display: grid; gap: 0; font-size: 0.86rem; min-width: 640px; }
.sekvens > div { padding: 6px 8px; }
.sekvens .bana { text-align: center; border-radius: 8px; background: var(--rb, var(--yta2)); margin: 0 4px 6px; padding: 8px 6px; }
.sekvens .bana strong { display: block; font-size: 0.85rem; }
.sekvens .bana .liten { font-size: 0.72rem; color: var(--svag); display: block; }
.sekvens .steg { border-top: 1px solid var(--kant); }
.sekvens .steg .nr { font-family: ui-monospace, Menlo, monospace; color: var(--svag); margin-right: 6px; }
.sekvens .steg .op { display: block; font-size: 0.75rem; color: var(--svag); margin-top: 2px; }
.sekvens .liv { border-top: 1px solid var(--kant); position: relative; }
.sekvens .liv::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px dashed var(--kant); }
.sekvens .pil { position: relative; align-self: center; height: 22px; z-index: 1; pointer-events: none; }
.sekvens .pil .linje { position: absolute; top: 10px; height: 2px; background: var(--text); }
.sekvens .pil .linje::after { content: ""; position: absolute; top: -5px; border: 6px solid transparent; }
.sekvens .pil.höger .linje::after { right: -6px; border-left-color: var(--text); border-right-width: 0; }
.sekvens .pil.vänster .linje::after { left: -6px; border-right-color: var(--text); border-left-width: 0; }
.sekvens .pil .själv { position: absolute; top: 2px; left: calc(50% - 2px); width: 26px; height: 16px; border: 2px solid var(--text); border-left: 0; border-radius: 0 8px 8px 0; }
.sekvens .pil.saknas .linje { background: var(--utelamnat); }
.sekvens .pil.saknas.höger .linje::after { border-left-color: var(--utelamnat); }
.sekvens .pil.saknas.vänster .linje::after { border-right-color: var(--utelamnat); }
.sekvens .invävd, .sekvens .rubrikrad.invävd { background: color-mix(in srgb, var(--federation-bg) 70%, transparent); }
.sekvens .rubrikrad { border-top: 1px solid var(--kant); font-size: 0.8rem; color: var(--federation); font-weight: 600; padding: 6px 8px; }
.sekvens .rubrikrad.alt { color: var(--svag); font-weight: 500; font-style: italic; background: none; }
.ok { color: var(--lokal); } .nej { color: var(--utelamnat); font-weight: 700; }
.sekvensram { overflow-x: auto; margin: 8px 0 4px; }
/* Studio */
.studiorad { padding: 12px 16px; margin-bottom: 18px; border-color: color-mix(in srgb, var(--fokus) 45%, var(--kant)); }
.studiorad h3 { margin: 0 0 6px; }
.knapp {
  border: 1px solid var(--kant); background: var(--yta); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 0.88rem;
  display: inline-flex; align-items: center; gap: 6px;
}
.knapp.primar { background: var(--fokus); border-color: var(--fokus); color: var(--bg); font-weight: 600; }
.knapp:disabled { opacity: 0.5; cursor: progress; }
.knapprad { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.formular { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 8px 14px; align-items: center; margin: 10px 0; }
.formular label { color: var(--svag); font-size: 0.85rem; }
input.falt, select.falt, textarea.falt {
  width: 100%; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--kant); background: var(--yta); color: var(--text); font: inherit; font-size: 0.9rem;
}
textarea.falt { min-height: 54px; resize: vertical; }
.kryss { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.kryss label { display: inline-flex; gap: 6px; align-items: center; font-size: 0.9rem; }
.stegkort { border: 1px solid var(--kant); border-radius: 10px; padding: 10px; margin: 8px 0; background: var(--yta); }
.stegkort.inkl { background: color-mix(in srgb, var(--stodtjanst-bg) 60%, var(--yta)); }
.stegrad { display: grid; grid-template-columns: 34px minmax(160px, 2fr) repeat(4, minmax(90px, 1fr)) auto; gap: 6px; align-items: center; }
.stegrad .nr { font-family: ui-monospace, Menlo, monospace; color: var(--svag); }
.paret { display: grid; grid-template-columns: minmax(100px, 160px) 1fr auto; gap: 6px; margin: 4px 0; }
pre.yaml { background: var(--yta2); border-radius: 8px; padding: 10px; overflow: auto; max-height: 420px; font-size: 0.8rem; }
.meddelande { border-radius: 8px; padding: 8px 12px; margin: 8px 0; background: var(--yta2); }
/* Anslutningar och testmiljöläge */
.testband { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; background: var(--test-bg); color: var(--test); border-radius: 10px; padding: 8px 14px; margin: 0 0 10px; font-weight: 600; }
.testband .svag { color: inherit; opacity: 0.85; font-weight: 400; }
.testmiljo .studiorad { border-color: color-mix(in srgb, var(--test) 60%, var(--kant)); }
.testmiljo h1::after { content: ' · testmiljö'; color: var(--test); }
.miljo { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.miljo.test { background: var(--test-bg); color: var(--test); }
.miljo.prod { background: var(--tjanst-bg); color: var(--tjanst); }
.kedja { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.kedja .steg { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; border: 1px dashed var(--kant); color: var(--svag); white-space: nowrap; }
.kedja .steg.nadd { border: 1px solid transparent; background: color-mix(in srgb, var(--lokal) 15%, transparent); color: var(--lokal); }
.kedja .steg.nu { font-weight: 700; border-color: var(--lokal); }
.kedja .pil { color: var(--svag); font-size: 0.75rem; }
.scopes { display: flex; flex-wrap: wrap; gap: 4px; }
.scopes code { font-size: 0.78rem; background: var(--yta2); border-radius: 5px; padding: 1px 6px; }
.guide h3 { display: flex; gap: 8px; align-items: center; }
.guide h3 .nr { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--test-bg); color: var(--test); font-size: 0.8rem; }
.rollval { border: 1px solid var(--kant); border-radius: 10px; padding: 8px 12px; margin: 6px 0; }
.rollval .kryss { margin: 6px 0 0 24px; }
@media (max-width: 760px) { .stegrad { grid-template-columns: 28px 1fr 1fr; } .formular { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  main { padding-top: 16px; }
  .panel { padding: 14px; }
  table.matris tbody th { width: auto; }
}
</style>
</head>
<body>
<main>
  <header class="topp">
    <div>
      <h1>Kompositionsmatris</h1>
      <p class="svag liten" id="undertitel"></p>
    </div>
    <div class="sok" role="search">
      <input id="sok" type="search" placeholder="Sök artefakt, aktör eller paket …" autocomplete="off"
             aria-label="Sök artefakt, aktör eller paket" aria-controls="sokresultat" aria-expanded="false">
      <ul id="sokresultat" role="listbox" hidden></ul>
    </div>
  </header>

  <section class="kort studiorad" id="studio" aria-label="Studio" hidden></section>

  <section class="kort matrisram" aria-label="Matris innehåll × federation">
    <table class="matris" id="matris"></table>
  </section>
  <div class="förklaring" id="förklaring"></div>

  <section class="kort alla" id="alla" aria-label="IG:ar i arbetsytan"></section>

  <section class="kort systemlista" id="system" aria-label="System" hidden></section>

  <section class="kort panel" id="panel" aria-live="polite"></section>

  <p class="fot" id="fot"></p>
</main>

<script>
const DATA = /*__DATA__*/null;

// ------------------------------------------------------------------ hjälp
const el = (tag, attrs = {}, ...barn) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }

function tillampadeSteg(m) {
  const ut = new Map();
  const samla = (lista) => {

        const nyckel = `${st.kalla.flode}|${st.id || st.kalla.nr}`;
        if (!ut.has(nyckel)) ut.set(nyckel, st);
      }
      samla((st.alternativ || []).flatMap((a) => a.steg));
    }
  };
  for (const u of m.anvandningsfall) samla(u.steg);
  return [...ut.values()];
}

function tillampningsVal(m, s) {

// Status för ett API-krav, räknat bara på valda roller (samma regel som i system.mjs).
function apiStatus(item, aktiva) {
  const aktiv = (x) => x.roller.some((r) => aktiva.has(r));
  const delar = [...item.interaktioner, ...item.sokparametrar, ...item.profiler].filter(aktiv);
  if (!delar.length && !item.roller.some((r) => aktiva.has(r))) return null;
  if (delar.some((d) => d.finns === null) || item.typFinns === null) return 'okänt';
  if (!item.typFinns) return 'saknas';
  return delar.every((d) => d.finns) ? 'ok' : 'delvis';
}

    if (`${i.id} ${i.titel}`.toLowerCase().includes(q)) ut.push({ etikett: i.titel, typ: 'IG', info: ROLL[i.roll] || 'IG', roll: i.id, gå: () => välj(i.roll === 'tjanst' ? 'tjanst' : 'paket', i.id) });
  }
  for (const a of artefakter.values()) {
    if (`${a.namn} ${a.titel || ''}`.toLowerCase().includes(q)) {
      ut.push({ etikett: a.titel || a.namn, typ: a.typ, info: `${a.typ} · ${a.finns.length} IG`, roll: a.paket, gå: () => välj('artefakt', a.nyckel) });
    }
  }
  // Exakt träff före början-träff före övriga; därefter IG:ar, profiler och aktörer före annat.
  const TYP = { IG: 0, Profile: 1, ActorDefinition: 2, Extension: 3, Requirements: 4, CapabilityStatement: 5 };
  const rang = (t) => {
    const e = t.etikett.toLowerCase();
    return [e === q ? 0 : e.startsWith(q) ? 1 : 2, TYP[t.typ] ?? 9, e];
  };
  return ut
    .sort((a, b) => { const [x, y] = [rang(a), rang(b)]; return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2], 'sv'); })
    .slice(0, 14);
}
function visaTräffar() {
  sökLista.replaceChildren(...träffar.map((t, n) => el('li', {

}
function stängSök() { träffar = []; markör = -1; visaTräffar(); }
sökfält.addEventListener('input', () => { träffar = sök(sökfält.value); markör = träffar.length ? 0 : -1; visaTräffar(); });
sökfält.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && träffar.length) { markör = (markör + 1) % träffar.length; visaTräffar(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && träffar.length) { markör = (markör - 1 + träffar.length) % träffar.length; visaTräffar(); e.preventDefault(); }
  else if (e.key === 'Enter' && markör >= 0) { träffar[markör].gå(); stängSök(); }

});

    roller: u.roller.map((x) => ({ tjanst: x.tjanst, aktor: x.aktor, ...(x.informationsmangder ? { informationsmangder: x.informationsmangder } : {}), ...(x.adressater?.length ? { adressater: x.adressater } : {}) })),
  });
  const förhandsgranska = () => {
    clearTimeout(r.timer);
    if (!u.roller.length) return förhand.replaceChildren(el('p', { class: 'tom' }, 'Välj minst en tjänst att konsumera.'));
    förhand.replaceChildren(el('p', { class: 'svag' }, 'Tar fram behörigheter …'));
    r.timer = setTimeout(async () => {
      try {
        const x = await api('POST', '/api/anslut/forhandsgranska', { ...kropp(), system: /^[A-Za-z][A-Za-z0-9]*$/.test(u.system) ? u.system : 'NyKlient' });
        förhand.replaceChildren(...[
          x.fel.length ? el('ul', {}, x.fel.map((f) => el('li', { class: 'nej' }, f))) : null,
          el('p', {}, 'Scopes totalt: ', scopesEl(x.scopes)),
          ritaScopes(x.behorigheter), ritaKlientCs(x.klientCs), ritaWso2(x.wso2, true)].filter(Boolean));
      } catch (e) {
        förhand.replaceChildren(el('div', { class: 'meddelande nej' }, e.message));
      }
    }, 250);
  };

  p.append(el('div', { class: 'panelhuvud' }, el('h2', {}, 'Anslut klient'), miljöEl('test')),
    el('p', { class: 'svag' }, 'Motsvarar Hantera behörigheter. Välj system och de tjänster klienten ska konsumera. Klientens CapabilityStatement, scopes per mottagare och vad som skulle skapas i WSO2 tas fram ur tjänsternas IG:er; taket är rollens förmågor. I testmiljön blir anslutningen behörig direkt. Produktion kräver att rollen är testad och godkänd.'));
  const g = el('div', { class: 'guide' });
  p.append(g);
  systemSteg(g, r, u, om, förhandsgranska);

  g.append(el('h3', {}, el('span', { class: 'nr' }, '2'), 'Tjänster att konsumera'));
  const tjänster = Object.values(M).filter((m) => m.ig.roll === 'tjanst' && (KR[m.ig.id] || []).length);
  if (!tjänster.length) g.append(el('p', { class: 'tom' }, 'Inga tjänster har konsumentroller.'));
  for (const m of tjänster) {
    const t = m.ig.id;
    for (const aktor of KR[t]) {
      const vald = u.roller.find((x) => x.tjanst === t && x.aktor === aktor);
      const finns = testAnslutning(t, aktor);
      const mängder = m.informationsmangder || [];
      g.append(el('div', { class: 'rollval' },
        el('label', { class: 'kryss' }, el('input', { type: 'checkbox', checked: !!vald, onchange: (e) => {
          if (e.target.checked) u.roller.push({ tjanst: t, aktor, informationsmangder: finns?.informationsmangder ? [...finns.informationsmangder] : null, adressater: finns?.adressater ? [...finns.adressater] : null });
          else u.roller = u.roller.filter((x) => x !== vald);
          om();
        } }), prick(t), ' ', el('b', {}, m.ig.titel), ' · ', m.aktorer[aktor]?.titel || aktor,
        finns ? el('span', { class: 'status registrerad', style: 'margin-left:6px' }, `test: ${STATUSTITEL[finns.status]}`) : null),
        vald && mängder.length ? el('div', {},
          el('label', { class: 'liten', style: 'margin-left:24px' }, el('input', { type: 'checkbox', checked: !vald.informationsmangder, onchange: (e) => {
            vald.informationsmangder = e.target.checked ? null : mängder.map((i) => i.nyckel);
            om();
          } }), ' alla informationsmängder'),
          vald.informationsmangder ? kryss(mängder.map((i) => i.nyckel), vald.informationsmangder, (n) => mängder.find((i) => i.nyckel === n).titel, förhandsgranska) : null) : null,
        vald ? el('div', { style: 'margin:6px 0 0 24px' },
          el('label', { class: 'liten' }, el('input', { type: 'checkbox', checked: !vald.adressater, onchange: (e) => {
            vald.adressater = e.target.checked ? null : [];
            om();
          } }), ' alla logiska adressater'),
          vald.adressater ? falt({ placeholder: 'HSA-id för adressaterna, t.ex. SE2321000099-EXMP, kommaseparerade', style: 'margin-top:4px', onchange: förhandsgranska },
            vald.adressater.join(', '), (v) => { vald.adressater = v.split(/[\s,]+/).filter(Boolean); }) : null) : null));
    }
  }

  g.append(el('h3', {}, el('span', { class: 'nr' }, '3'), 'Behörigheter, klientförmåga och WSO2'), förhand);
  const knapp = el('button', { class: 'knapp primar', disabled: !u.roller.length, onclick: () => {
    if (!/^[A-Za-z][A-Za-z0-9]*$/.test(u.system)) return knapp.after(el('div', { class: 'meddelande nej' }, 'Systemnamnet ska vara bokstäver och siffror, t.ex. VardappY.'));
    if (u.roller.some((x) => x.informationsmangder && !x.informationsmangder.length)) return knapp.after(el('div', { class: 'meddelande nej' }, 'Välj minst en informationsmängd per tjänst, eller alla.'));
    if (u.roller.some((x) => x.adressater && !x.adressater.length)) return knapp.after(el('div', { class: 'meddelande nej' }, 'Ange minst en adressat, eller välj alla.'));
    spara(knapp, 'POST', '/api/anslut', kropp(), { vy: 'system', id: u.system, flik: 'beh' });
  } }, 'Begär testbehörighet');
  g.append(el('h3', {}, el('span', { class: 'nr' }, '4'), 'Begär'),
    el('p', { class: 'svag liten' }, 'Rollerna läggs till systemet och anslutningarna i test förs begärd → behörig. Nästa steg, testad, kräver en testrapport; därefter kan systemet ansöka om produktion.'),
    el('div', { class: 'knapprad' }, knapp, el('button', { class: 'knapp', onclick: avbryt }, 'Avbryt')));
  förhandsgranska();
}

function anslutProducent(namn = '') { redigera({ typ: 'producent', namn, tillbaka: { ...state } }); }
function ritaAnslutProducent(p, r) {
  const PR = STUDIO.producentroller || {};
  const u = r.utkast ||= { ...utkastFrån(r.namn), adress: '' };
  if (u.adress === undefined) u.adress = '';
  if (!u.adress && u.andpunkter?.length) u.adress = u.andpunkter[0];
  const analys = SYSTEM.find((x) => x.system === u.system);
  const om = () => ritaPanel();
  const förhand = el('div', { 'aria-live': 'polite' });
  const kropp = () => ({ ...systemKropp(u), adress: u.adress, roller: u.roller.map((x) => ({ tjanst: x.tjanst, aktor: x.aktor, informationsmangder: x.informationsmangder })) });
  const ÅTGÄRD = { skapa: 'skapas', uppdatera: 'utökas' };
  const förhandsgranska = () => {
    clearTimeout(r.timer);
    if (!u.roller.length) return förhand.replaceChildren(el('p', { class: 'tom' }, 'Välj minst en tjänst att producera för.'));
    if (!/^https?:\/\/\S+$/.test(u.adress)) return förhand.replaceChildren(el('p', { class: 'tom' }, 'Ange anropsadressen.'));
    förhand.replaceChildren(el('p', { class: 'svag' }, 'Tar fram registreringen …'));
    r.timer = setTimeout(async () => {
      try {
        const x = await api('POST', '/api/anslut/producent/forhandsgranska', { ...kropp(), system: /^[A-Za-z][A-Za-z0-9]*$/.test(u.system) ? u.system : 'NyProducent' });
        förhand.replaceChildren(...[
          el('p', { class: 'svag liten' }, `I testmiljöns katalog (system/${x.katalog}):`),
          x.andringar.length ? el('div', { class: 'tabellram' }, el('table', { class: 'data' },
            el('thead', {}, el('tr', {}, ['Resurs', 'Vad', 'Innehåll'].map((h) => el('th', {}, h)))),
            el('tbody', {}, x.andringar.map((a) => el('tr', {},
              el('td', { class: 'mono liten' }, `${a.resurs.resourceType}/${a.resurs.id}`),
              el('td', {}, ÅTGÄRD[a.atgard] || a.atgard),
              el('td', { class: 'liten' },
                a.resurs.resourceType === 'Endpoint' ? [el('div', { class: 'mono' }, a.resurs.address), ...(a.nya || (a.resurs.extension || []).filter((e) => e.url.endsWith('/implements')).map((e) => e.valueCanonical)).map((s) => el('div', { class: 'mono via' }, `implements ${s}`))]
                  : a.resurs.resourceType === 'CapabilityStatement' ? `tjänsteinstans, instantiates ${(a.nya || a.resurs.instantiates).length} specifikationer`
                    : a.resurs.resourceType === 'OrganizationAffiliation' ? `medlemskap i ${a.resurs.organization.reference}`
                      : `${a.resurs.name || ''}`),
            ))))) : el('p', { class: 'ja' }, 'Allt finns redan registrerat.'),
          el('details', {}, el('summary', {}, 'Resurserna som JSON'), el('pre', { class: 'yaml' }, JSON.stringify(x.andringar.map((a) => a.resurs), null, 2))),
          el('h4', {}, 'Producentens egna anrop'),
          el('p', { class: 'svag liten' }, 'I drift registrerar producenten själv i tjänstekatalogen, med dessa scopes.'),
          ritaScopes(x.behorigheter), ritaWso2(x.wso2)].filter(Boolean));
      } catch (e) {
        förhand.replaceChildren(el('div', { class: 'meddelande nej' }, e.message));
      }
    }, 250);
  };

  p.append(el('div', { class: 'panelhuvud' }, el('h2', {}, 'Anslut producent'), miljöEl('test')),
    el('p', { class: 'svag' }, 'Motsvarar Skapa vägval. Välj system, tjänster och informationsmängder och ange anropsadressen. Studion registrerar anslutningspunkten (Endpoint) med de specifikationer den implementerar, tjänsteinstansen och vid behov organisationen och medlemskapet i federationen, i testmiljöns katalog som den mockade federationen använder. Anslutningarna i test blir behöriga direkt.'));
  const g = el('div', { class: 'guide' });
  p.append(g);
  systemSteg(g, r, u, () => { if (!u.adress && u.andpunkter?.length) u.adress = u.andpunkter[0]; om(); }, förhandsgranska);

  g.append(el('h3', {}, el('span', { class: 'nr' }, '2'), 'Tjänster och informationsmängder'));
  for (const m of Object.values(M).filter((x) => x.ig.roll === 'tjanst' && (PR[x.ig.id] || []).length)) {
    const t = m.ig.id;
    for (const pr of PR[t]) {
      const vald = u.roller.find((x) => x.tjanst === t && x.aktor === pr.aktor);
      const finns = analys?.behorighet?.anslutningar.find((x) => x.miljo === 'test' && x.tjanst === t && x.aktor === pr.aktor);
      const oblig = pr.informationsmangder.filter((i) => i.krav === 'obligatorisk').map((i) => i.nyckel);
      g.append(el('div', { class: 'rollval' },
        el('label', { class: 'kryss' }, el('input', { type: 'checkbox', checked: !!vald, onchange: (e) => {
          if (e.target.checked) u.roller.push({ tjanst: t, aktor: pr.aktor, informationsmangder: [...(analys?.roller.find((x) => x.tjanst === t && x.aktor === pr.aktor)?.informationsmangder || []).filter((i) => i.vald && i.krav !== 'obligatorisk').map((i) => i.nyckel)] });
          else u.roller = u.roller.filter((x) => x !== vald);
          om();
        } }), prick(t), ' ', el('b', {}, m.ig.titel), ' · ', m.aktorer[pr.aktor]?.titel || pr.aktor,
        finns ? el('span', { class: 'status registrerad', style: 'margin-left:6px' }, `test: ${STATUSTITEL[finns.status]}`) : null),
        vald ? kryss(pr.informationsmangder.map((i) => i.nyckel), vald.informationsmangder, (n) => {
          const i = pr.informationsmangder.find((x) => x.nyckel === n);
          return `${i.titel} (${i.krav})`;
        }, förhandsgranska, oblig) : null));
    }
  }

  g.append(el('h3', {}, el('span', { class: 'nr' }, '3'), 'Anropsadress (vägval)'),
    el('div', { class: 'formular' }, el('label', {}, 'Adress'),
      falt({ placeholder: 'https://fhir.exempel.se/r5', onchange: förhandsgranska }, u.adress, (v) => { u.adress = v.trim(); })),
    el('p', { class: 'svag liten' }, 'Adressen konsumenterna hittar i tjänstekatalogen. Finns redan en anslutningspunkt med adressen utökas den med de nya specifikationerna.'));
  g.append(el('h3', {}, el('span', { class: 'nr' }, '4'), 'Registrering i testmiljöns katalog'), förhand);
  const knapp = el('button', { class: 'knapp primar', disabled: !u.roller.length, onclick: () => {
    if (!/^[A-Za-z][A-Za-z0-9]*$/.test(u.system)) return knapp.after(el('div', { class: 'meddelande nej' }, 'Systemnamnet ska vara bokstäver och siffror, t.ex. VardsystemY.'));
    if (!/^https?:\/\/\S+$/.test(u.adress)) return knapp.after(el('div', { class: 'meddelande nej' }, 'Ange anropsadressen.'));
    spara(knapp, 'POST', '/api/anslut/producent', kropp(), { vy: 'system', id: u.system, flik: 'beh' });
  } }, 'Registrera anslutningspunkt (test)');
  g.append(el('h3', {}, el('span', { class: 'nr' }, '5'), 'Registrera'),
    el('p', { class: 'svag liten' }, 'Systemet får rollerna, adressen och informationsmängderna, och anslutningarna i test förs begärd → behörig. Kör sedan federationstestet; med testrapporten blir rollen testad och kan ansöka om produktion.'),
    el('div', { class: 'knapprad' }, knapp, el('button', { class: 'knapp', onclick: avbryt }, 'Avbryt')));
  förhandsgranska();
}

// ------------------------------------------------------------------ start
function rita() { ritaMatris(); ritaAlla(); ritaSystemlista(); if (STUDIO) ritaStudiorad(); ritaPanel(); }
function start() {
  if (!DATA) {
    document.getElementById('panel').append(el('p', {}, 'Ingen data. Sidan genereras med ', el('code', {}, 'ig-composer vy'), '.'));
    return;
  }
  const antal = Object.keys(M).length;
  document.getElementById('undertitel').textContent =
    `Innehåll × federation · ${igs.size} IG:ar, ${antal} med komposition.json · genererad ${new Date(DATA.genererad).toLocaleString('sv-SE')}`;
  const saknas = [...igs.values()].filter((i) => i.komponerar?.length && !M[i.id]).map((i) => i.id);
  document.getElementById('fot').textContent = saknas.length
    ? `Saknar komposition.json: ${saknas.join(', ')}. Kör ig-composer bygg före ig-composer vy.`
    : 'Data från varje IG:s komposition.json, framtagen av ig-composer.';
  if (STUDIO) {
    document.title = TESTLÄGE ? 'Kompositionsstudio – testmiljö' : 'Kompositionsstudio';
    document.querySelector('h1').textContent = 'Kompositionsstudio';
    if (TESTLÄGE) document.body.classList.add('testmiljo');
  }
  ritaFörklaring();
  läsHash();
  rita();
}
window.addEventListener('hashchange', () => { läsHash(); rita(); });
start();
</script>
