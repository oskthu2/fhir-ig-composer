name: Bygg och testa

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      infopeak:
        description: Kör också läsadaptern mot referensrealiseringen på infopeak
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bygg:
    runs-on: ubuntu-latest
    # Definitionsregistret: HAPI FHIR R5 som tjänst, för registertestet.
    services:
      register:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          hapi.fhir.fhir_version: R5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verktyg/package-lock.json

      - name: Installera SUSHI och verktyget
        run: |
          npm install -g fsh-sushi@3
          npm ci --prefix verktyg

      - name: Komponera och bygg alla IG:ar
        run: node verktyg/ig-composer.mjs bygg

      - name: Vänta på definitionsregistret
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/fhir/metadata -o /dev/null && exit 0; sleep 5; done
          echo "HAPI startade inte" && exit 1

      # Testerna läser bland annat varje IG:s komposition.json från bygget.
      - name: Testa verktyget
        run: npm test --prefix verktyg
        env:
          FHIR_REGISTER_TEST: http://localhost:8080/fhir

      - name: Publicera definitionerna i registret
        run: |
          node verktyg/ig-composer.mjs register publicera --server http://localhost:8080/fhir
          node verktyg/ig-composer.mjs register lista --server http://localhost:8080/fhir >> "$GITHUB_STEP_SUMMARY"

      - name: Systemrapporter (krav, gap och testlista per system)
        run: node verktyg/ig-composer.mjs system

      - name: Federationstest mot mockad federation
        run: |
          node verktyg/ig-composer.mjs federation testa
          cat rapport/federation.md >> "$GITHUB_STEP_SUMMARY"

      # Läsläge mot en extern miljö: bara på begäran, så att bygget inte beror på den.
      - name: Federationstest mot infopeak (läsläge)
        if: ${{ inputs.infopeak }}
        run: |
          node verktyg/ig-composer.mjs federation testa --mot infopeak
          cat rapport/federation-infopeak.md >> "$GITHUB_STEP_SUMMARY"

      - name: Matris innehåll × federation
        run: |
          node verktyg/ig-composer.mjs matris
          cat matris.md >> "$GITHUB_STEP_SUMMARY"

      - name: Interaktiv matrisvy
        run: node verktyg/ig-composer.mjs vy

      - name: Webbrot för fhir.inera.se
        run: node verktyg/ig-composer.mjs publicera --ut publicerat

      - name: Prova innehållsförhandlingen (nginx)
        run: |
          docker run -d --name webb -p 8081:80 \
            -v "$PWD/webb/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/publicerat:/usr/share/nginx/html:ro" nginx:1.27-alpine
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:8081/ && break; sleep 1; done
          sh webb/prova.sh http://localhost:8081

      - uses: actions/upload-artifact@v4
        with:
          name: webbrot
          path: publicerat/

      - uses: actions/upload-artifact@v4
        with:
          name: matrisvy
          path: vy.html

      - uses: actions/upload-artifact@v4
        with:
          name: systemrapporter
          path: rapport/
