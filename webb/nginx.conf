# fhir.inera.se: IG:arnas webbrot (ig-composer publicera) med innehållsförhandling
# på kanoniska URL:er, och definitionsregistret (HAPI) under /fhir/.
#
#   GET /ig/npo/StructureDefinition/vardkontakt-npo
#     Accept: text/html (webbläsare)        → 302 till StructureDefinition-vardkontakt-npo.html
#     Accept: application/fhir+json         → resursen som JSON (application/fhir+json)
#     Accept: application/fhir+xml          → resursen som XML (application/fhir+xml)
#     ?_format=json|xml|html                går före Accept
#   GET /ig/npo/0.1.0/StructureDefinition/… samma, för en viss version
#   GET /fhir/StructureDefinition?url=…     sökning i definitionsregistret

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  charset utf-8;
  charset_types text/xml text/plain application/json application/fhir+json application/fhir+xml;

  map $http_accept $format_accept {
    default                      html;
    "~*application/fhir\+json"   json;
    "~*application/json"         json;
    "~*application/fhir\+xml"    xml;
    "~*(application|text)/xml"   xml;
  }
  map $arg__format $format {
    default                  $format_accept;
    json                     json;
    application/json         json;
    application/fhir+json    json;
    xml                      xml;
    application/xml          xml;
    application/fhir+xml     xml;
    html                     html;
    text/html                html;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    # Docker:s inbyggda DNS; registret slås upp vid anrop, så webben startar även utan det.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Kanonisk URL: /ig/<namn>/[<version>/]<Typ>/<id>
    location ~ "^/ig/(?<ig>[^/]+)/(?:(?<ver>[0-9][^/]*)/)?(?<typ>[A-Z][A-Za-z]+)/(?<rid>[A-Za-z0-9\-.]{1,64})$" {
      set $katalog /ig/$ig/;
      if ($ver) { set $katalog /ig/$ig/$ver/; }
      if ($format = html) { return 302 $katalog$typ-$rid.html; }
      if ($format = xml) { rewrite ^ $katalog$typ-$rid.xml last; }
      rewrite ^ $katalog$typ-$rid.json last;
    }

    # Resursfilerna med FHIR:s medietyper.
    location ~ "^/ig/.+/[A-Z][A-Za-z]+-[^/]+\.json$" {
      types { } default_type application/fhir+json;
      add_header Access-Control-Allow-Origin * always;
      add_header Vary "Accept" always;
    }
    location ~ "^/ig/.+/[A-Z][A-Za-z]+-[^/]+\.xml$" {
      types { } default_type application/fhir+xml;
      add_header Access-Control-Allow-Origin * always;
      add_header Vary "Accept" always;
    }
    location ~ "/package-list\.json$" {
      add_header Access-Control-Allow-Origin * always;
    }

    # Definitionsregistret (HAPI FHIR R5).
    location /fhir/ {
      set $register http://register:8080;
      proxy_pass $register$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Access-Control-Allow-Origin * always;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
