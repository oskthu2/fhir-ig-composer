# Lokalt: docker compose up
#   Studion            http://localhost:4900/
#   Studion, testmiljö  http://localhost:4901/  (Anslut klient (test))
#   Definitionsregister http://localhost:8080/fhir (HAPI FHIR R5)
#   Publicerat          http://localhost:8081/ (som fhir.inera.se: webbrot + innehållsförhandling)
# Bygg webbroten först: docker compose exec studio node verktyg/ig-composer.mjs publicera
# Publicera definitionerna i registret:
#   docker compose exec studio node verktyg/ig-composer.mjs register publicera
# Samma filer används av devcontainern (Codespaces eller VS Code Dev Containers).
services:
  studio:
    build: .
    ports:
      - "4900:4900"   # studion
      - "4800:4800"   # federation starta --port 4800
    volumes:
      - .:/arbetsyta
    environment:
      FHIR_REGISTER: http://register:8080/fhir
      # Läsadapterns hämtning av externa specifikationer (valfritt):
      INFOPEAK_ANVANDARE: ${INFOPEAK_ANVANDARE:-}
      INFOPEAK_LOSENORD: ${INFOPEAK_LOSENORD:-}
    depends_on:
      - register

  # Studion i testmiljöläge: klienter ansluts till test, inget annat redigeras.
  # Samma arbetsyta; väntar tills studio-tjänsten har installerat beroendena.
  studio-test:
    build: .
    ports:
      - "4901:4901"
    volumes:
      - .:/arbetsyta
    environment:
      STUDIO_MILJO: test
    command:
      - sh
      - -c
      - until [ -d verktyg/node_modules/yaml ]; do sleep 5; done; exec node verktyg/ig-composer.mjs studio --miljo test --port 4901
    depends_on:
      - studio

  # Webbroten från ig-composer publicera, som på fhir.inera.se: kanoniska URL:er
  # ger HTML, JSON eller XML efter Accept, och /fhir/ går till registret.
  webb:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./webb/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./publicerat:/usr/share/nginx/html:ro
    depends_on:
      - register

  register:
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R5
      hapi.fhir.allow_external_references: "true"
