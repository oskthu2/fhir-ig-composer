# Förutsättning (extension forutsattning): ingår i varje tjänst i Individuell tillgång.
anvandningsfall: AnslutaKallsystemIndividuell
nyckel: IND-AK
titel: Ansluta källsystem för individuell tillgång
syfte: >-
  Ett källsystem ska gå att hitta för invånartjänsten: det registreras i
  tjänstekatalogen, och invånartjänsten avgör med capability discovery vad
  källsystemet stödjer.

aktorer:
  kalla: IndividuellKallsystem
  katalog: Tjanstekatalog
  invanartjanst: IndividuellKonsument

steg:
  - inkludera: RegistreraAndpunkt
    roller:
      registrerare: kalla
      katalog: katalog
  - id: formagor
    titel: Invånartjänsten tar reda på vad källsystemet stödjer
    fran: invanartjanst
    till: kalla
    aktivitet: kontrollera
    krav: Källsystemet SKA exponera ett CapabilityStatement (kind=instance) som anger vilka tjänster och profiler det stödjer.
