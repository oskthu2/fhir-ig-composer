id: inera.fed.individuell
canonical: https://fhir.inera.se/ig/individuell
name: IneraFederationIndividuell
title: "Federation: Individuell tillgång"
description: "Federationsbyggblock för invånares direktåtkomst till sin egen vårddokumentation (patientdatalagen 5 kap. 5 §, GDPR art. 15). Krav på märkning av information som inte får visas för invånaren, och stödtjänster. Begränsar aldrig kliniska element."
