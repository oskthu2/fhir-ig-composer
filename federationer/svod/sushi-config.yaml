id: inera.fed.svod
canonical: https://fhir.inera.se/ig/svod
name: IneraFederationSVOD
title: "Federation: SVOD – Sammanhållen vård- och omsorgsdokumentation"
description: "Federationsbyggblock för SVOD (patientdatalagen 6 kap.). Krav på säkerhetsmetadata för inre och yttre spärr, proveniens, och stödtjänster. Begränsar aldrig kliniska element."
status: draft
version: 0.1.0
fhirVersion: 5.0.0
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0

publisher:
  name: Inera AB
  url: https://www.inera.se

jurisdiction: urn:iso:std:iso:3166#SE "Sweden"

dependencies:
  inera.build.conventions: 0.1.0

extension:
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/ig-roll
    valueCode: federation
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/publicering
    valueCode: intern
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/federationsmonster
    extension:
      - url: ruleset
        valueString: SVODMetadata
      - url: profilprefix
        valueString: SVODMetadata
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/flodesmonster
    extension:
      - url: vid
        valueCode: search-type
      - url: vid
        valueCode: read
      - url: fore
        valueString: SVODVerifieraPatientrelation
      - url: foreEnGang
        valueBoolean: true
      - url: efter
        valueString: SVODSparrOchLoggning
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/komponerar
    extension:
      - url: paket
        valueString: inera.build.conventions
      - url: version
        valueString: 0.1.0

parameters:
  usage-stats-opt-out: true
  i18n-default-lang: sv

pages:
  index.md:
    title: Hem
  komposition.md:
    title: Komposition

menu:
  Hem: index.html
  Komposition: komposition.html
  Artefakter: artifacts.html
