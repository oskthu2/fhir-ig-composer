id: inera.fed.pot2
canonical: https://fhir.inera.se/ig/fed-pot2
name: IneraFederationPOT2
title: "Federation: Patientöversiktsfederationen (T2)"
description: "Informationsfederation för patientöversikt enligt RIVTA T2: medlemskap i federationsmedlemskatalogen, tjänstesökning i tjänstekatalogen, åtkomstintyg och engagemangsindex. Inga krav på kliniska element."
status: draft
version: 0.1.0
fhirVersion: 5.0.0
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0

publisher:
  name: Inera AB
  url: https://www.inera.se

jurisdiction: urn:iso:std:iso:3166#SE "Sweden"

dependencies:
  inera.build.conventions: 0.1.0

extension:
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/ig-roll
    valueCode: federation
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/publicering
    valueCode: intern
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/forutsattning
    valueString: BliMedlem
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/forutsattning
    valueString: AnslutaKallsystemPOT2
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/forutsattning
    valueString: AnmalaEngagemangPOT2
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/flodesmonster
    extension:
      - url: vid
        valueCode: search-type
      - url: vid
        valueCode: read
      - url: fore
        valueString: EngagemangsUppslag
      - url: foreEnGang
        valueBoolean: true
      - url: foreVarje
        valueString: T2Uppslag
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/komponerar
    extension:
      - url: paket
        valueString: inera.build.conventions
      - url: version
        valueString: 0.1.0
  - url: https://fhir.inera.se/ig/conventions/StructureDefinition/komponerar
    extension:
      - url: paket
        valueString: inera.st.t2
      - url: version
        valueString: 0.1.0

parameters:
  usage-stats-opt-out: true
  i18n-default-lang: sv

pages:
  index.md:
    title: Hem
  komposition.md:
    title: Komposition

menu:
  Hem: index.html
  Komposition: komposition.html
  Artefakter: artifacts.html
