# Globala kompositionsregler för Ineras FHIR-miljö.
#
# Läses av verktyg/ig-composer.mjs. Varje regel kan överstyras
# mer specifikt, och den mest specifika vinner:
#   1. global regel (denna fil)
#   2. IG-nivå: extension på ImplementationGuide i sushi-config.yaml
#      (komponerar.inkludering)
#   3. artefaktnivå: * insert Kompositionsanvisning(#exkludera) i FSH
version: 1

inkludering:
  # Hur ett beroende tas med, utifrån beroendets extension publicering.
  intern: kopiera
  publik: referera

kopiering:
  # Källans canonical skrivs om till mottagarens (SUSHI sätter url utifrån
  # mottagarens canonical; hårdkodade URL:er skrivs om textuellt).
  kanoniskOmskrivning: true
  # Varje kopierad definition får extension kopierad-fran = källa|version.
  sparaUrsprung: true
  # Exempel (Usage: #example) kopieras inte; tjänsten tar fram egna exempel
  # som validerar mot tjänsteprofilerna.
  exempel: hoppa-over
  # RuleSets och alias kopieras även från refererade beroenden, eftersom
  # FSH inte delar dem mellan paket.
  ruleSetsAlltid: true

federation:
  # Generera <profilprefix><Resurstyp> för varje resurstyp som tjänsten
  # exponerar, från federationens RuleSet (extension federationsmonster).
  genereraMonsterprofiler: true
  # Kopierade profiler som tjänsten exponerar oförändrade får federationens
  # profil som ytterligare bas (Bas) vid kopieringen.
  basPaKopieradeProfiler: true
  # Lokala tjänsteprofiler måste själva deklarera federationens bas.
  # fel | varning
  basPaLokalaProfiler: fel
  # En federation får bara begränsa dessa element. Det gör att multipelt
  # arv aldrig kan krocka på ett kliniskt element.
  tillatenYta: [meta, extension]

lager:
  # Vilka roller en IG med given roll får komponera.
  byggblock:  [byggblock, konvention]
  federation: [federation, stodtjanst, konvention]
  stodtjanst: [stodtjanst, konvention]
  tjanst:     [byggblock, federation, konvention]
  konvention: []
  # En tjänst ligger i exakt en federation (en cell i matrisen).
  federationerPerTjanst: 1

aktorer:
  # En lokal aktör i en tjänst måste (transitivt) härledas från minst en
  # aktör i ett byggblock och en aktör i tjänstens federation.
  tjanstaktorKraver: [byggblock, federation]

  # Generera <Aktör>CS (CapabilityStatement, kind=requirements) som
  # importerar förfädernas förmågor och listar tjänstens profiler.
  genereraFormagor: true
  # Generera <Aktör>Krav (Requirements) med derivedFrom till förfädernas krav.
  genereraKrav: true

informationsmangder:
  # En specifikation (CapabilityStatement kind=requirements) genereras per
  # informationsmängd i en tjänst: per exponerad profil som realiserar ett
  # informationsbehov. Källsystemens förmågor importerar dem, och T1-uppslag
  # och registrering sker per informationsmängd.
  generera: true
  # Namn på genererad specifikation: <Informationsbehov utan "Info">API
  suffix: API

scenarier:
  # Skissformatet för användningsfall och delflöden, relativt varje IG.
  katalog: input/scenarier
  # Federationens flödesmönster vävs in i tjänstens användningsfall.
  vavning: true
  # Federationens förutsättningar (extension forutsattning) ingår i varje
  # tjänst i federationen.
  forutsattningar: true
  # ExampleScenario per användningsfall och delflöde, och Requirements per
  # användningsfall och deltagande aktör (en sats per steg).
  genereraKrav: true
  # Täckningskontroller: fel | varning
  tackning:
    aktorUtanDefinition: fel            # rollen finns inte som ActorDefinition
    informationsbehovUtanModell: fel    # informationsbehovet finns inte som logisk modell
    informationsbehovUtanProfil: fel    # ingen profil realiserar informationsbehovet
    rollUtanTjanstaktor: varning        # ingen tjänsteaktör spelar alla roller i en scenarioaktör
    formagaSaknas: varning              # avsändare/mottagare saknar interaktionen i sina förmågor

system:
  # Ett system som antar en roll som härleds från registreringsrollen förväntas
  # ha en anslutningspunkt och en tjänsteinstans i tjänstekatalogen per
  # informationsmängd det implementerar.
  registreringsroll: TjanstekatalogRegistrerare
  # Ett system som antar en roll som härleds från medlemsrollen förväntas ha
  # ett aktivt medlemskap i tjänstens federation.
  medlemsroll: Federationsmedlem
