# Användningsfall: ett system registrerar sin ändpunkt och sina API-instanser
# i tjänstekatalogen. Inkluderas i federationernas anslutningsfall.
anvandningsfall: RegistreraAndpunkt
nyckel: TK
titel: Registrera ändpunkt och API-instanser i tjänstekatalogen
syfte: >-
  Ett system ska gå att hitta för de tjänster det deltar i: dess ändpunkt och
  de API-specifikationer ändpunktens API:er följer registreras i
  tjänstekatalogen.

aktorer:
  registrerare: TjanstekatalogRegistrerare
  katalog: Tjanstekatalog

steg:
  - titel: Systemet registrerar sin tekniska ändpunkt
    fran: registrerare
    till: katalog
    operation: create
    resurstyp: Endpoint
  - titel: Systemet registrerar en API-instans per tjänst det deltar i
    fran: registrerare
    till: katalog
    operation: create
    resurstyp: CapabilityStatement
    krav: >-
      Systemet SKA registrera en API-instans (CapabilityStatement kind=instance)
      per tjänst och roll, med instantiates = tjänstens API-specifikation
      (url|version) och implementation.url = ändpunktens adress.
