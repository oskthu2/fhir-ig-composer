# Ett konkret system och de roller det antar i olika tjänster. ig-composer
# summerar kraven över rollerna och jämför med nuläget.
system: JournalX
titel: Journalsystem X
organisation:
  namn: Region Exempel
  hsaId: SE2321000099-EXMP
andpunkter:
  - https://fhir.journalx.region-exempel.se/r5
roller:
  - tjanst: inera.tjanst.npo
    aktor: NPOKallsystem
  - tjanst: inera.tjanst.npo
    aktor: NPOKonsument
  - tjanst: inera.tjanst.journal1177
    aktor: Journal1177KallsystemMarkande
nulage:
  # CapabilityStatement (kind=instance), som från GET [bas]/metadata
  formaga: nulage/journalx-metadata.json
  # T2-katalogerna: organisationer, medlemskap, anslutningspunkter,
  # tjänsteinstanser och engagemang
  katalog: nulage/t2-katalog.json
# Tillval systemet antar, och valda informationsmängder per tjänst. Utan val
# gäller de obligatoriska och de valfria som nuläget redan har.
tillval: []
informationsmangder:
  inera.tjanst.npo: [VardkontaktInfo]
# Vad systemet faktiskt är godkänt för, per miljö.
anslutningar:
  - tjanst: inera.tjanst.npo
    aktor: NPOKallsystem
    miljo: test
    status: testad
    historik:
      - { status: begard, datum: 2026-06-01, av: Region Exempel }
      - { status: behorig, datum: 2026-06-01, av: automatiskt i testmiljön }
      - { status: testad, datum: 2026-06-15, av: Region Exempel }
    bevis:
      - { typ: testrapport, fil: rapport/federation.md, datum: 2026-06-15 }
  - tjanst: inera.tjanst.npo
    aktor: NPOKallsystem
    miljo: prod
    status: ansluten
    historik:
      - { status: ansokt, datum: 2026-06-16, av: Region Exempel }
      - { status: godkand, datum: 2026-06-30, av: Tjänsteägare NPÖ }
      - { status: ansluten, datum: 2026-07-01, av: Inera AB }
    bevis:
      - { typ: beslut, text: Godkänd för produktion, datum: 2026-06-30 }
  - tjanst: inera.tjanst.npo
    aktor: NPOKonsument
    miljo: test
    status: behorig
    informationsmangder: [VardkontaktInfo]
    historik:
      - { status: begard, datum: 2026-10-20, av: Region Exempel }
      - { status: behorig, datum: 2026-10-20, av: automatiskt i testmiljön }
